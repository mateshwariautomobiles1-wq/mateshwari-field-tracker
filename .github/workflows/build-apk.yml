name: Build APK + Admin Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Release (APK)
  pages: write      # Admin Panel website
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key (GitHub Secret KEYSTORE_BASE64)
        working-directory: android
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.keystore
          else echo "::warning::KEYSTORE_BASE64 secret nahi hai - update ke liye purana app uninstall karna padega"; fi
      - name: APK build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk FieldTracker.apk
      - name: GitHub Release (APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Field Tracker v1.0.${{ github.run_number }}
          body: "Employee phone par install karne ke liye FieldTracker.apk download karein."
          files: FieldTracker.apk
          make_latest: true

  admin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin
      - id: deploy
        uses: actions/deploy-pages@v4
